name: Release

# A tag vX.Y.Z on main publishes that version to Maven Central, signed, after
# the tests pass on every supported Java, then makes the GitHub release.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  test:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ["11", "17", "21", "25"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: ./mvnw -B -ntp verify

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
      - name: Set the version from the tag
        run: ./mvnw -B -ntp versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false
      - name: Publish to Maven Central
        run: ./mvnw -B -ntp -P release -Dgpg.bestPractices=true deploy
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          # The variable maven-gpg-plugin 3.2 reads the passphrase from.
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      - name: Docs bundle
        # target/docs is written by DocsBundleTest in this build: the manifest
        # and the examples the developer docs vendor (sync-sdk-java.sh).
        run: |
          test -f target/docs/docs-manifest.json
          grep -q "\"version\": \"${GITHUB_REF_NAME#v}\"" target/docs/docs-manifest.json
          (cd target/docs && zip -qr "../docs-examples-${GITHUB_REF_NAME}.zip" .)
      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes target/ubik-java-*.jar "target/docs-examples-${GITHUB_REF_NAME}.zip"
        env:
          GH_TOKEN: ${{ github.token }}
