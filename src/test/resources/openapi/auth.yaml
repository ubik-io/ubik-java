openapi: 3.0.3
info:
  title: UBIK API authentication
  x-title-fr: Authentification de l'API UBIK
  version: "1"
  description: |
    Get an access token for the UBIK API with an organization's API key.
  x-description-fr: |
    Obtenez un jeton d'accès à l'API UBIK avec une clé d'API de votre
    organisation.
paths:
  /api/v1/auth/certs:
    get:
      operationId: GetCerts
      security: []
      x-api-key-scopes: []
      x-api-key-rights: []
      summary: Get the token signing keys
      x-summary-fr: Obtenir les clés de signature des jetons
      description: |
        The public keys that verify the signature of UBIK access tokens. No
        access token needed.
      x-description-fr: |
        Les clés publiques qui vérifient la signature des jetons d'accès
        UBIK. Aucun jeton d'accès requis.
      responses:
        "200":
          description: The keys (a JWK set, RFC 7517).
          x-description-fr: Les clés (un ensemble JWK, RFC 7517).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JWKContainer"
              example:
                {
                  "keys": [
                    {
                      "kty": "RSA",
                      "use": "sig",
                      "kid": "kid-1",
                      "alg": "RS256",
                      "n": "x-LGT0MnOXPVZfDtVbp082OWYD02SdqD8lyPOyqEKZkueCI2tt2tjo-v_p-LTbHY7TKwHtvSW0P73Xjxbvyyp9dfaNr6AD0VbtG6gF_lML1EJ6PMMsFq_qOlO-Hl_25F0-2L1l_s5CJNNQjYe8yRtihGS--h2nEqJ9FpYzwzQZ6e1T5rWO6Ze1gCbuOcLdlUu_7ydo-P5hpkrnxvK3vGIrsLqlaaIk0NGDFGvBfPnSUNm9quzBCOucR_ozlDoB7CNm3tiCCzpx9zj9VHUsdQYMKDGySqZP9i1zoCowI_HbrHR002VJRNkp43tzn5n3Pqhg2b4PB2VBypA0LkOyt9obbPVbw2Zp3SzACTzdoAGQbq9n9V11mdaUijdhEMR6HebriJ-pLnzEWkN-ijg92tnLptkm7w60zM66tFw7Qo5CHRGsJmeXaaw-DCfu4k62c6U_1uNGk2rG-5DeQCtAJIGU1Ln6fk4_dlz-gc812Fge9G6ExhmJK2CK8AO46ZycnyYefPVGrcMSfeSGZ42IhsjYNcVpHD1p2xCNITpAfLXocv_-uVvXKJXJ57ghVHAzmu5iafLpA_3Vr0aAaUe1cywO7pOVBQoF9ELVfMob3iJjQatWBJnLRdUy4L2K2ZVHD8NAFPqrKvOgvUr6UeXSGJtyY0dZ9yfz5lX5CTJBrpI2E",
                      "e": "AQAB"
                    }
                  ]
                }
        "500":
          description: |
            Server error.
            Body: empty.
          x-description-fr: |
            Erreur du serveur.
            Corps : vide.
  /api/v1/auth/oauth/token:
    post:
      operationId: GetToken
      security: []
      x-api-key-scopes: []
      x-api-key-rights: []
      summary: Get a token
      x-summary-fr: Obtenir un jeton
      description: |
        Exchange an assertion signed with your API key file for an access
        token. No access token needed: this request gives you one.
      x-description-fr: |
        Échangez une assertion signée avec le fichier de votre clé d'API
        contre un jeton d'accès. Aucun jeton d'accès requis : cette requête
        vous en donne un.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/GetTokenRequest"
            example:
              {
                "grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer",
                "assertion": "eyJhbGciOiJSUzI1NiIsImtpZCI6ImtleS0yIiwidHlwIjoiSldUIn0.eyJpc3MiOiI3YzlkMGUxZi0zYTRiLTRjNWQtOGU2Zi0wYTFiMmMzZDRlNWYiLCJzdWIiOiI3YzlkMGUxZi0zYTRiLTRjNWQtOGU2Zi0wYTFiMmMzZDRlNWYiLCJhdWQiOiJodHRwczovL3ViaWsuaW8vYXBpL3YxL2F1dGgvb2F1dGgvdG9rZW4iLCJpYXQiOjE3OTQyNjg4MDAsImV4cCI6MTc5NDI2ODg2MCwianRpIjoiNWUxYjdkM2EtOWM0Zi00YTJlLThiNmQtMWYzYzVhN2U5ZDIwIn0.ZXhhbXBsZS1hc3NlcnRpb24tc2lnbmF0dXJl",
                "scope": "login:7d1f3a5c-2b4e-4f6a-8c9d-0e1f2a3b4c5d:rw cdr:7d1f3a5c-2b4e-4f6a-8c9d-0e1f2a3b4c5d:r"
              }
      responses:
        "200":
          description: |
            The access token. The body is JSON, sent with the header
            Content-Type: text/plain; read it as JSON.
          x-description-fr: |
            Le jeton d'accès. Le corps est du JSON, envoyé avec l'en-tête
            Content-Type: text/plain; lisez-le comme du JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetTokenSuccessResponse"
              example:
                {
                  "access_token": "eyJhbGciOiJSUzI1NiIsImtpZCI6ImtpZC0xIiwidHlwIjoiSldUIn0..ZXhhbXBsZS1hY2Nlc3MtdG9rZW4tc2lnbmF0dXJl",
                  "id_token": "",
                  "token_type": "Bearer",
                  "expires_in": 900
                }
        "400":
          description: |
            Request refused. Each line is the error code, then the cause:
            - Plain-text body: the form can't be read.
            - Plain-text body: grant_type is unknown.
            - invalid_request: assertion is empty.
            - invalid_grant: the assertion isn't a JWT.
            - invalid_grant: iat is missing.
            - invalid_grant: exp is more than 5 minutes after iat.
            - invalid_grant: this jti was already used.
            - invalid_scope: scope asks for a scope the API key doesn't hold.
          x-description-fr: |
            Requête refusée. Chaque ligne donne le code d'erreur, puis la cause :
            - Corps en texte brut : le formulaire est illisible.
            - Corps en texte brut : grant_type est inconnu.
            - invalid_request : assertion est vide.
            - invalid_grant : l'assertion n'est pas un JWT.
            - invalid_grant : iat est absent.
            - invalid_grant : exp est plus de 5 minutes après iat.
            - invalid_grant : ce jti a déjà été utilisé.
            - invalid_scope : scope demande une portée que la clé d'API n'a pas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetTokenErrorResponsePayload"
              examples:
                assertion_empty:
                  value:
                    {
                      "error": "invalid_request",
                      "error_description": "field assertion cannot be empty"
                    }
                assertion_not_a_jwt:
                  value:
                    {
                      "error": "invalid_grant",
                      "error_description": "assertion is malformed"
                    }
                lifetime_too_long:
                  value:
                    {
                      "error": "invalid_grant",
                      "error_description": "assertion lifetime exceeds the allowed maximum"
                    }
                jti_reused:
                  value:
                    {
                      "error": "invalid_grant",
                      "error_description": "The provided authorization grant has already been used."
                    }
                scope_not_held:
                  value:
                    {
                      "error": "invalid_scope",
                      "error_description": "Scope phone:7d1f3a5c-2b4e-4f6a-8c9d-0e1f2a3b4c5d:rw is forbidden for client"
                    }
            text/plain:
              schema:
                type: string
              examples:
                unknown_grant_type:
                  value: "invalid grant_type: password"
        "401":
          description: |
            Assertion refused. Each line is the error code, then the cause:
            - invalid_grant: the API key doesn't exist.
            - invalid_grant: the API key was deleted.
            - invalid_grant: kid isn't one of the API key's files.
            - invalid_grant: the signature doesn't match the key file.
            - invalid_grant: aud is wrong.
            - invalid_grant: exp is missing.
            - invalid_grant: exp is past.
            - invalid_grant: sub differs from iss.
            - invalid_request: scope can't be read.
          x-description-fr: |
            Assertion refusée. Chaque ligne donne le code d'erreur, puis la cause :
            - invalid_grant : la clé d'API n'existe pas.
            - invalid_grant : la clé d'API a été supprimée.
            - invalid_grant : kid n'est pas un des fichiers de la clé d'API.
            - invalid_grant : la signature ne correspond pas au fichier de clé.
            - invalid_grant : aud est faux.
            - invalid_grant : exp est absent.
            - invalid_grant : exp est passé.
            - invalid_grant : sub est différent de iss.
            - invalid_request : scope est illisible.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetTokenErrorResponsePayload"
              examples:
                assertion_refused:
                  value:
                    {
                      "error": "invalid_grant",
                      "error_description": "The provided authorization grant is invalid, expired, or revoked."
                    }
                scope_unreadable:
                  value:
                    {
                      "error": "invalid_request",
                      "error_description": "invalid scope found"
                    }
        "403":
          description: Never sent to an API key.
          x-description-fr: Jamais envoyé à une clé d'API.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetTokenErrorResponsePayload"
        "500":
          description: |
            Server error.
            Body: the JSON error server_error.
          x-description-fr: |
            Erreur du serveur.
            Corps : l'erreur JSON server_error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetTokenErrorResponsePayload"
              example:
                {
                  "error": "server_error",
                  "error_description": ""
                }
components:
  schemas:
    JWKContainer:
      type: object
      additionalProperties: false
      required: [keys]
      properties:
        keys:
          type: array
          description: The keys in use.
          x-description-fr: Les clés en usage.
          items:
            $ref: "#/components/schemas/JWK"
    JWK:
      type: object
      additionalProperties: false
      required: [kty, use, kid, alg, n, e]
      properties:
        kty:
          type: string
          enum: [RSA]
          description: Key type.
          x-description-fr: Type de clé.
        use:
          type: string
          enum: [sig]
          description: Used for signatures.
          x-description-fr: Sert aux signatures.
        kid:
          type: string
          minLength: 1
          description: The key's id, as in the kid header of the tokens it signs.
          x-description-fr: L'id de la clé, comme dans l'en-tête kid des jetons qu'elle signe.
        alg:
          type: string
          enum: [RS256]
          description: Signature algorithm.
          x-description-fr: Algorithme de signature.
        "n":
          type: string
          minLength: 1
          description: RSA modulus, base64url.
          x-description-fr: Module RSA, en base64url.
        e:
          type: string
          minLength: 1
          description: RSA exponent, base64url.
          x-description-fr: Exposant RSA, en base64url.
    GetTokenRequest:
      type: object
      additionalProperties: false
      required: [grant_type]
      properties:
        grant_type:
          type: string
          enum:
            - authorization_code
            - refresh_token
            - client_credentials
            - urn:ietf:params:oauth:grant-type:jwt-bearer
          description: |
            - urn:ietf:params:oauth:grant-type:jwt-bearer: with an API key.
            - authorization_code, refresh_token, client_credentials: used by UBIK's own apps.
          x-description-fr: |
            - urn:ietf:params:oauth:grant-type:jwt-bearer : avec une clé d'API.
            - authorization_code, refresh_token, client_credentials : utilisés par les applications UBIK.
        assertion:
          type: string
          description: |
            Required. A JWT signed with the private_key of your API key file.
            - Header alg: RS256.
            - Header kid: the key file's key_id.
            - Without kid: the API key's first file is used.
            - iss: the key file's id.
            - sub: the key file's id.
            - aud: https://ubik.io/api/v1/auth/oauth/token.
            - iat: now, in Unix seconds.
            - exp: at most 5 minutes after iat.
            - Clock tolerance on exp: 30 seconds.
            - jti: required in practice; send a new unique id in each assertion.
            - Without jti: every API key shares one empty id, so after one assertion without jti, every other one is refused at least until that one expires, plus 30 seconds.
          x-description-fr: |
            Obligatoire. Un JWT signé avec la private_key du fichier de votre clé d'API.
            - En-tête alg : RS256.
            - En-tête kid : le key_id du fichier de clé.
            - Sans kid : le premier fichier de la clé d'API est utilisé.
            - iss : l'id du fichier de clé.
            - sub : l'id du fichier de clé.
            - aud : https://ubik.io/api/v1/auth/oauth/token.
            - iat : maintenant, en secondes Unix.
            - exp : au plus 5 minutes après iat.
            - Tolérance d'horloge sur exp : 30 secondes.
            - jti : obligatoire en pratique; envoyez un nouvel id unique dans chaque assertion.
            - Sans jti : toutes les clés d'API partagent un même id vide; après une assertion sans jti, toute autre est refusée au moins jusqu'à l'expiration de la première, plus 30 secondes.
        scope:
          type: string
          description: |
            The scopes you need, separated by spaces. Each one is resource:organization:action, for example cdr:7d1f3a5c-2b4e-4f6a-8c9d-0e1f2a3b4c5d:r.
            The token holds only the scopes you ask for, and only ones the API key holds.
          x-description-fr: |
            Les portées dont vous avez besoin, séparées par des espaces. Chacune est ressource:organisation:action, par exemple cdr:7d1f3a5c-2b4e-4f6a-8c9d-0e1f2a3b4c5d:r.
            Le jeton n'a que les portées demandées, et seulement celles que la clé d'API a.
        code:
          type: string
          description: Used by UBIK's own apps.
          x-description-fr: Utilisé par les applications UBIK.
        redirect_uri:
          type: string
          description: Used by UBIK's own apps.
          x-description-fr: Utilisé par les applications UBIK.
        code_verifier:
          type: string
          description: Used by UBIK's own apps.
          x-description-fr: Utilisé par les applications UBIK.
        client_id:
          type: string
          description: Used by UBIK's own apps.
          x-description-fr: Utilisé par les applications UBIK.
        refresh_token:
          type: string
          description: Used by UBIK's own apps.
          x-description-fr: Utilisé par les applications UBIK.
    GetTokenSuccessResponse:
      type: object
      additionalProperties: false
      required: [access_token, id_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          minLength: 1
          description: "The access token. Send it in the header Authorization, after Bearer and a space."
          x-description-fr: "Le jeton d'accès. Envoyez-le dans l'en-tête Authorization, après Bearer et une espace."
        id_token:
          type: string
          description: Empty for an API key.
          x-description-fr: Vide pour une clé d'API.
        token_type:
          type: string
          enum: [Bearer]
          description: The token type.
          x-description-fr: Le type de jeton.
        expires_in:
          type: integer
          minimum: 1
          description: Seconds until the token expires. Ask for a new one then.
          x-description-fr: Secondes avant l'expiration du jeton. Demandez-en un nouveau ensuite.
    GetTokenErrorResponsePayload:
      type: object
      additionalProperties: false
      required: [error, error_description]
      properties:
        error:
          type: string
          enum:
            - invalid_request
            - invalid_grant
            - invalid_scope
            - server_error
            - impersonation_expired
          description: |
            - invalid_request: a field is missing or can't be read.
            - invalid_grant: the assertion is refused.
            - invalid_scope: a scope the API key doesn't hold.
            - server_error: an error on UBIK's side.
            - impersonation_expired: used by UBIK's own apps only.
          x-description-fr: |
            - invalid_request : un champ est absent ou illisible.
            - invalid_grant : l'assertion est refusée.
            - invalid_scope : une portée que la clé d'API n'a pas.
            - server_error : une erreur du côté d'UBIK.
            - impersonation_expired : utilisé par les applications UBIK seulement.
        error_description:
          type: string
          description: A sentence that explains the error, in English. May be empty.
          x-description-fr: Une phrase qui explique l'erreur, en anglais. Peut être vide.
