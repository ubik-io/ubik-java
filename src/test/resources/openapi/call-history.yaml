          type: integer
          format: int64
          description: When the step started, in Unix milliseconds.
          x-description-fr: Le début de l'étape, en millisecondes Unix.
        end_timestamp_milli:
          type: integer
          format: int64
          description: When the step ended, in Unix milliseconds.
          x-description-fr: La fin de l'étape, en millisecondes Unix.
        outcome:
          type: string
          description: |
            How the step ended. Other values can appear.
            - ANSWERED: the step answered the call.
          x-description-fr: "Comment l'étape s'est terminée. D'autres valeurs peuvent apparaître.\n- ANSWERED\_: l'étape a répondu à l'appel.\n"
