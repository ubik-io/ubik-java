components:
  securitySchemes:
    ubikToken:
      type: oauth2
      description: |
        An access token, sent in the header Authorization: Bearer <token>.
        Get it from Get a token with your API key, asking in scope for every
        scope the request needs: the token holds only the scopes you ask for.
        The flow type below is a placeholder: OpenAPI 3.0 has no jwt-bearer
        flow. Request the token with
        grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer, your signed
        assertion in assertion, and the scopes in scope.
      x-description-fr: "Un jeton d'accès, envoyé dans l'en-tête Authorization: Bearer <jeton>.\nObtenez-le avec Obtenir un jeton et votre clé d'API, en demandant dans\nscope chaque portée dont la requête a besoin\_: le jeton n'a que les\nportées demandées.\nLe type de flux ci-dessous est un substitut\_: OpenAPI 3.0 n'a pas de\nflux jwt-bearer. Demandez le jeton avec\ngrant_type=urn:ietf:params:oauth:grant-type:jwt-bearer, votre assertion\nsignée dans assertion, et les portées dans scope.\n"
      flows:
        clientCredentials:
          tokenUrl: /api/v1/auth/oauth/token
          scopes:
            login:{org_id}:rw: Member of the organization. Every API key has it.
            cdr:{org_id}:r: Read the organization's CDRs.
            cdr:{org_id}:rw: Same as cdr:{org_id}:r here.
            admin:{org_id}:r: The organization's administrator. Never an API key.
            admin:{org_id}:rw: The organization's administrator. Never an API key.
          x-scopes-fr:
            login:{org_id}:rw: Membre de l'organisation. Toute clé d'API l'a.
            cdr:{org_id}:r: Lire les CDR de l'organisation.
            cdr:{org_id}:rw: Comme cdr:{org_id}:r ici.
            admin:{org_id}:r: L'administrateur de l'organisation. Jamais une clé d'API.
            admin:{org_id}:rw: L'administrateur de l'organisation. Jamais une clé d'API.
  parameters:
    CDRID:
      name: id
      in: path
      required: true
      description: The CDR's id.
      x-description-fr: L'id du CDR.
      schema:
        type: string
    OrgID:
      name: org_id
      in: query
      required: true
      description: Your organization's id.
      x-description-fr: L'id de votre organisation.
      schema:
        type: string
  responses:
    BadRequestOrgID:
      description: |
        Request refused:
        - org_id is empty.
        Body: plain text.
      x-description-fr: "Requête refusée\_:\n- org_id est vide.\nCorps\_: texte brut.\n"
      content:
        text/plain:
          schema:
            type: string
    Unauthorized:
      description: |
        Access token refused:
        - The access token is missing.
        - The access token has expired.
        - The access token is invalid.
        Body: plain text.
      x-description-fr: "Jeton d'accès refusé\_:\n- Le jeton d'accès est absent.\n- Le jeton d'accès a expiré.\n- Le jeton d'accès est invalide.\nCorps\_: texte brut.\n"
      content:
        text/plain:
          schema:
            type: string
    Forbidden:
      description: |
        Refused:
        - The token lacks a scope this request needs.
        Body: plain text, naming the missing scope.
      x-description-fr: "Refusé\_:\n- Il manque au jeton une portée dont cette requête a besoin.\nCorps\_: texte brut, qui nomme la portée manquante.\n"
      content:
        text/plain:
          schema:
            type: string
    FileNotFound:
      description: |
        Not found:
        - The CDR doesn't exist in this organization.
        - file_id isn't a file of this kind for this CDR.
        Body: plain text.
      x-description-fr: "Introuvable\_:\n- Le CDR n'existe pas dans cette organisation.\n- file_id n'est pas un fichier de ce type pour ce CDR.\nCorps\_: texte brut.\n"
      content:
        text/plain:
          schema:
            type: string
          examples:
            cdr_not_found:
              value: cdr not found
            file_not_found:
              value: file not found
    NotProcessed:
      description: |
        The recording has no file to give. What to do, by state:
        - RECORDING_COMPLETE: try again later.
        - IN_PROGRESS: try again later.
        - FAILED_TOO_MANY_RETRIES: don't retry.
        - EXPIRED: don't retry.
        Body: plain text, "recording is" then the state.
      x-description-fr: "L'enregistrement n'a pas de fichier à donner. Que faire, selon l'état\_:\n- RECORDING_COMPLETE\_: réessayez plus tard.\n- IN_PROGRESS\_: réessayez plus tard.\n- FAILED_TOO_MANY_RETRIES\_: ne réessayez pas.\n- EXPIRED\_: ne réessayez pas.\nCorps\_: texte brut, « recording is » suivi de l'état.\n"
      content:
        text/plain:
          schema:
            type: string
          examples:
            recording_complete:
              value: recording is RECORDING_COMPLETE
            in_progress:
              value: recording is IN_PROGRESS
            failed_too_many_retries:
              value: recording is FAILED_TOO_MANY_RETRIES
            expired:
              value: recording is EXPIRED
    ServerError:
      description: |
        Server error.
        - Try again later.
        Body: empty.
      x-description-fr: "Erreur du serveur.\n- Réessayez plus tard.\nCorps\_: vide.\n"
  schemas:
    ListCDRRequest:
      type: object
      additionalProperties: false
      required:
        - org_id
        - list_query
      properties:
        org_id:
          type: string
          minLength: 1
          description: Your organization's id.
          x-description-fr: L'id de votre organisation.
        resource_type:
          type: string
          description: |
            Which CDRs.
            - Absent: every CDR of the organization in the time window.
            - Present: only the CDRs that touched a resource of this type.
            - EXTENSION: an extension.
            - PHONE: a phone.
            - USER: a user.
            - IVR: an automated attendant.
            - PHONE_NUMBER: one of your organization's phone numbers.
            - NUMBER: an outside number.
          x-description-fr: "Quels CDR.\n- Absent\_: tous les CDR de l'organisation dans la période.\n- Présent\_: seulement les CDR qui ont touché une ressource de ce type.\n- EXTENSION\_: un numéro de poste.\n- PHONE\_: un téléphone.\n- USER\_: un utilisateur.\n- IVR\_: un standard automatique.\n- PHONE_NUMBER\_: un des numéros de téléphone de votre organisation.\n- NUMBER\_: un numéro externe.\n"
        list_query:
          allOf:
            - $ref: '#/components/schemas/ListQuery'
          description: The filters, the order and the page.
          x-description-fr: Les filtres, l'ordre et la page.
    ListQuery:
      type: object
      additionalProperties: false
      required:
        - limit
      description: The filters, the order and the page.
      x-description-fr: Les filtres, l'ordre et la page.
      properties:
        filter:
          type: object
          additionalProperties: false
          description: |
            The filters. Without a lower bound on start_timestamp_milli: the 31
            days before the upper bound, or before now when there is none.
          x-description-fr: "Les filtres. Sans borne inférieure sur start_timestamp_milli\_: les 31\njours avant la borne supérieure, ou avant maintenant s'il n'y en a pas.\n"
          properties:
            operation_list:
              type: array
              description: |
                All must match; the values of one operation are alternatives.
              x-description-fr: |
                Toutes doivent correspondre ; les valeurs d'une même opération sont des choix.
              items:
                $ref: '#/components/schemas/Operation'
        sort:
          type: object
          additionalProperties: false
          description: The order. CDRs are always sorted by the call's start time.
          x-description-fr: L'ordre. Les CDR sont toujours triés par l'heure de début de l'appel.
          properties:
            field_name:
              type: string
              description: Empty, or start_timestamp_milli.
              x-description-fr: Vide, ou start_timestamp_milli.
            is_ascending:
              type: boolean
              description: Oldest first when true; newest first otherwise.
              x-description-fr: Les plus anciens d'abord si vrai ; les plus récents d'abord sinon.
        limit:
          type: object
          additionalProperties: false
          required:
            - nb_per_page
            - page
          description: The page.
          x-description-fr: La page.
          properties:
            nb_per_page:
              type: integer
              minimum: 1
              maximum: 100
              description: CDRs per page.
              x-description-fr: CDR par page.
            page:
              type: integer
              minimum: 1
              description: The page number; 1 is the first.
              x-description-fr: Le numéro de la page ; 1 est la première.
    Operation:
      type: object
      additionalProperties: false
      required:
        - field_name
        - operator
        - values
      description: One filter.
      x-description-fr: Un filtre.
      properties:
        field_name:
          type: string
          enum:
            - resource_id
            - start_timestamp_milli
            - direction
          description: >
            - resource_id: one resource of resource_type (for NUMBER, the number). Only with
            resource_type.

            - start_timestamp_milli: the call's start, in Unix milliseconds. The period may span at
            most 93 days.

            - direction: the call's direction.
          x-description-fr: "- resource_id\_: une ressource de resource_type (pour NUMBER, le numéro). Seulement avec resource_type.\n- start_timestamp_milli\_: le début de l'appel, en millisecondes Unix. La période peut couvrir au plus 93 jours.\n- direction\_: le sens de l'appel.\n"
        operator:
          type: string
          enum:
            - '='
            - '!='
            - '>'
            - '>='
            - <
            - <=
          description: How the field compares to the values.
          x-description-fr: Comment le champ se compare aux valeurs.
        values:
          type: array
          description: The values, as strings.
          x-description-fr: Les valeurs, en chaînes.
          items:
            type: string
    ListCDRResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - total
      properties:
        data:
          type: array
          description: The CDRs of this page.
          x-description-fr: Les CDR de cette page.
          items:
            $ref: '#/components/schemas/CDRItem'
        total:
          type: integer
          minimum: 0
          description: How many CDRs match, all pages together.
          x-description-fr: Le nombre de CDR correspondants, toutes pages confondues.
    CDRItem:
      type: object
      additionalProperties: false
      description: One CDR, without the call's steps.
      x-description-fr: Un CDR, sans les étapes de l'appel.
      required:
        - id
        - org_id
        - direction
        - disposition
        - src
        - dst
        - start_timestamp_milli
        - end_timestamp_milli
        - duration_milli
        - answered
        - answer_timestamp_milli
        - billable_duration_milli
        - created_timestamp_milli
        - recording_session_count
      properties:
        id:
          type: string
          description: The CDR's id.
          x-description-fr: L'id du CDR.
        org_id:
          type: string
          description: Your organization's id.
          x-description-fr: L'id de votre organisation.
        direction:
          type: string
          enum:
            - INBOUND_PSTN
            - OUTBOUND_PSTN
            - INTERNAL
            - EMERGENCY
            - UNKNOWN
          description: |
            - INBOUND_PSTN: from an outside number.
            - OUTBOUND_PSTN: to an outside number.
            - INTERNAL: between two of your organization's phones.
            - EMERGENCY: to an emergency number.
            - UNKNOWN: couldn't be determined.
          x-description-fr: "- INBOUND_PSTN\_: d'un numéro externe.\n- OUTBOUND_PSTN\_: vers un numéro externe.\n- INTERNAL\_: entre deux téléphones de votre organisation.\n- EMERGENCY\_: vers un numéro d'urgence.\n- UNKNOWN\_: indéterminé.\n"
        disposition:
          allOf:
            - $ref: '#/components/schemas/Disposition'
          description: >
            How the call ended. Other values can appear.

            - LAST_LEG_HUNGUP: ended normally; the last party hung up.

            - SOURCE_LEG_HUNGUP_BEFORE_SETUP_FINISHED: the caller hung up before the call was
            answered.

            - NO_ANSWER: nobody answered.

            - CALLEE_BUSY: the person called was busy.

            - DECLINE: the person called declined.

            - NOT_FOUND: the destination doesn't exist.

            - SERVICE_UNAVAILABLE: the destination was unavailable.

            - TRANSFER: the call was transferred.

            - BLIND_TRANSFER_FAILED: a transfer failed.

            - MEDIA_TIMEOUT: no audio for too long.

            - SETUP_ERROR: the call couldn't be set up.

            - SUSPENDED_ORG: the organization is suspended.

            - INACTIVE_ORG: the organization is inactive.
          x-description-fr: "Comment l'appel s'est terminé. D'autres valeurs peuvent apparaître.\n- LAST_LEG_HUNGUP\_: fin normale ; la dernière personne a raccroché.\n- SOURCE_LEG_HUNGUP_BEFORE_SETUP_FINISHED\_: l'appelant a raccroché avant la réponse.\n- NO_ANSWER\_: personne n'a répondu.\n- CALLEE_BUSY\_: l'appelé était occupé.\n- DECLINE\_: l'appelé a refusé.\n- NOT_FOUND\_: la destination n'existe pas.\n- SERVICE_UNAVAILABLE\_: la destination n'était pas disponible.\n- TRANSFER\_: l'appel a été transféré.\n- BLIND_TRANSFER_FAILED\_: un transfert a échoué.\n- MEDIA_TIMEOUT\_: aucun son pendant trop longtemps.\n- SETUP_ERROR\_: l'appel n'a pas pu s'établir.\n- SUSPENDED_ORG\_: l'organisation est suspendue.\n- INACTIVE_ORG\_: l'organisation est inactive.\n"
        src:
