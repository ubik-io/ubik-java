        How the call ended. Other values can appear.
        - LAST_LEG_HUNGUP: ended normally; the last party hung up.
        - SOURCE_LEG_HUNGUP_BEFORE_SETUP_FINISHED: the caller hung up before the call was answered.
        - NO_ANSWER: nobody answered.
        - CALLEE_BUSY: the person called was busy.
        - DECLINE: the person called declined.
        - NOT_FOUND: the destination doesn't exist.
        - SERVICE_UNAVAILABLE: the destination was unavailable.
        - TRANSFER: the call was transferred.
        - BLIND_TRANSFER_FAILED: a transfer failed.
        - MEDIA_TIMEOUT: no audio for too long.
        - SETUP_ERROR: the call couldn't be set up.
        - SUSPENDED_ORG: the organization is suspended.
        - INACTIVE_ORG: the organization is inactive.
      x-description-fr: "Comment l'appel s'est terminé. D'autres valeurs peuvent apparaître.\n- LAST_LEG_HUNGUP\_: fin normale ; la dernière personne a raccroché.\n- SOURCE_LEG_HUNGUP_BEFORE_SETUP_FINISHED\_: l'appelant a raccroché avant la réponse.\n- NO_ANSWER\_: personne n'a répondu.\n- CALLEE_BUSY\_: l'appelé était occupé.\n- DECLINE\_: l'appelé a refusé.\n- NOT_FOUND\_: la destination n'existe pas.\n- SERVICE_UNAVAILABLE\_: la destination n'était pas disponible.\n- TRANSFER\_: l'appel a été transféré.\n- BLIND_TRANSFER_FAILED\_: un transfert a échoué.\n- MEDIA_TIMEOUT\_: aucun son pendant trop longtemps.\n- SETUP_ERROR\_: l'appel n'a pas pu s'établir.\n- SUSPENDED_ORG\_: l'organisation est suspendue.\n- INACTIVE_ORG\_: l'organisation est inactive.\n"
    TimelineEntry:
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - start_timestamp_milli
      description: One step of the call.
      x-description-fr: Une étape de l'appel.
      properties:
        id:
          type: string
          description: The step's id.
          x-description-fr: L'id de l'étape.
        parent_id:
          type: string
          description: The step this one is part of; absent for the first step.
          x-description-fr: L'étape dont celle-ci fait partie ; absent pour la première étape.
        type:
          type: string
          description: |
            What the step is. Other values can appear.
            - INIT: the call starts.
            - FROM_SIP_PHONE: from one of your phones.
            - FROM_SIP_PSTN: from an outside number.
            - ROUTE_EXTENSION: routed to an extension.
            - ROUTE_PSTN: routed to an outside number.
            - RING_GROUP: a group of phones rings.
            - RING_PHONE: one phone rings.
            - TO_SIP_PSTN: sent to an outside number.
            - IVR: an automated attendant.
            - VOICEMAIL: the voicemail.
            - ANNOUNCEMENT: an announcement is played.
            - RECORDING_START: a recording starts.
            - RECORDING_STOP: a recording stops.
          x-description-fr: "Ce qu'est l'étape. D'autres valeurs peuvent apparaître.\n- INIT\_: l'appel commence.\n- FROM_SIP_PHONE\_: d'un de vos téléphones.\n- FROM_SIP_PSTN\_: d'un numéro externe.\n- ROUTE_EXTENSION\_: dirigé vers un poste.\n- ROUTE_PSTN\_: dirigé vers un numéro externe.\n- RING_GROUP\_: un groupe de téléphones sonne.\n- RING_PHONE\_: un téléphone sonne.\n- TO_SIP_PSTN\_: envoyé vers un numéro externe.\n- IVR\_: un standard automatique.\n- VOICEMAIL\_: la boîte vocale.\n- ANNOUNCEMENT\_: une annonce est jouée.\n- RECORDING_START\_: un enregistrement commence.\n- RECORDING_STOP\_: un enregistrement s'arrête.\n"
