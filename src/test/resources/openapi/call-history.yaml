openapi: 3.0.3
info:
  title: UBIK API CDR
  x-title-fr: CDR de l'API UBIK
  version: '1'
paths:
  /api/v1/cdr/list:
    post:
      operationId: ListCDRs
      security:
        - ubikToken:
            - login:{org_id}:rw
            - cdr:{org_id}:r
        - ubikToken:
            - login:{org_id}:rw
            - cdr:{org_id}:rw
        - ubikToken:
            - login:{org_id}:rw
            - admin:{org_id}:r
        - ubikToken:
            - login:{org_id}:rw
            - admin:{org_id}:rw
      x-api-key-scopes:
        - login:{org_id}:rw
        - cdr:{org_id}:r
      x-api-key-rights:
        - en: 'Call history: Read'
          fr: "Historique d'appel\_: Lecture"
      summary: List CDRs
      x-summary-fr: Lister les CDR
      description: |
        List your organization's CDRs over a period, newest first, one page
        at a time. Use it to find the calls that ended while your webhook was
        inactive.
      x-description-fr: |
        Listez les CDR de votre organisation sur une période, du plus
        récent au plus ancien, une page à la fois. Utilisez-la pour retrouver
        les appels terminés pendant que votre webhook était désactivé.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListCDRRequest'
            example:
              org_id: 7d1f3a5c-2b4e-4f6a-8c9d-0e1f2a3b4c5d
              resource_type: EXTENSION
              list_query:
                filter:
                  operation_list: []
                sort:
                  field_name: start_timestamp_milli
                  is_ascending: false
                limit:
                  nb_per_page: 50
                  page: 1
      responses:
        '200':
          description: One page of CDRs, and how many CDRs match in all.
          x-description-fr: Une page de CDR, et le nombre total de CDR correspondants.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCDRResponse'
              example:
                data:
                  - id: 3f6c1a9e-8b2d-4e7f-9a1c-5d3b2e8f4a6c
                    org_id: 7d1f3a5c-2b4e-4f6a-8c9d-0e1f2a3b4c5d
                    direction: OUTBOUND_PSTN
                    disposition: LAST_LEG_HUNGUP
                    src: '+15145550100'
                    dst: '+14385550199'
                    start_timestamp_milli: 1790806478564
                    end_timestamp_milli: 1790806478777
                    duration_milli: 213
                    answered: true
                    answer_timestamp_milli: 1790806478747
                    billable_duration_milli: 30
                    created_timestamp_milli: 1790806480000
                    from:
                      resource_type: PHONE
                      resource_id: fd1e353a-83ab-52e5-8859-1de5fecad017
                      label_snapshot: Reception
                      deleted: false
                      phone:
                        id: fd1e353a-83ab-52e5-8859-1de5fecad017
                        description: Reception
                        user:
                          id: e8f6a65d-7b33-55ee-ad17-5b11f8a459b2
                          fullname: Julie Gagnon
                          picture_url: ''
                    to:
                      resource_type: NUMBER
                      resource_id: '+14385550199'
                      label_snapshot: '+14385550199'
                      deleted: false
                    recording_session_count: 2
                total: 1
        '400':
          description: |
            Request refused:
            - The body isn't JSON.
            - org_id is empty.
            - resource_type is PROVIDER.
            - list_query has no limit.
            - nb_per_page isn't between 1 and 100.
            - page is less than 1.
            - A filter uses a field that isn't allowed.
            - A filter uses an operator that isn't allowed.
            - A start_timestamp_milli value isn't a number.
            - The period is longer than 93 days.
            Body: plain text, naming the problem.
          x-description-fr: "Requête refusée\_:\n- Le corps n'est pas du JSON.\n- org_id est vide.\n- resource_type vaut PROVIDER.\n- list_query n'a pas de limit.\n- nb_per_page n'est pas entre 1 et 100.\n- page est inférieur à 1.\n- Un filtre utilise un champ non permis.\n- Un filtre utilise un opérateur non permis.\n- Une valeur de start_timestamp_milli n'est pas un nombre.\n- La période dépasse 93 jours.\nCorps\_: texte brut, qui nomme le problème.\n"
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/cdr/{id}:
    get:
      operationId: GetCDR
      security:
        - ubikToken:
            - login:{org_id}:rw
            - cdr:{org_id}:r
        - ubikToken:
            - login:{org_id}:rw
            - cdr:{org_id}:rw
        - ubikToken:
            - login:{org_id}:rw
            - admin:{org_id}:r
        - ubikToken:
            - login:{org_id}:rw
            - admin:{org_id}:rw
      x-api-key-scopes:
        - login:{org_id}:rw
        - cdr:{org_id}:r
      x-api-key-rights:
        - en: 'Call history: Read'
          fr: "Historique d'appel\_: Lecture"
      summary: Get a CDR
      x-summary-fr: Lire un CDR
      description: |
        Read one CDR: who called whom, how the call went step by step, and
        its recordings with the ids of their files.
      x-description-fr: "Lisez un CDR\_: qui a appelé qui, le déroulement de l'appel étape par\nétape, et ses enregistrements avec les id de leurs fichiers.\n"
      parameters:
        - $ref: '#/components/parameters/CDRID'
        - $ref: '#/components/parameters/OrgID'
      responses:
        '200':
          description: |
            The CDR. Keep the ETag header and send it back in If-None-Match:
            you get a 304 with no body while the CDR hasn't changed.
          x-description-fr: "Le CDR. Gardez l'en-tête ETag et renvoyez-le dans If-None-Match\_:\nvous recevez un 304 sans corps tant que le CDR n'a pas changé.\n"
          headers:
            ETag:
              description: The version of this answer.
              x-description-fr: La version de cette réponse.
              schema:
                type: string
            Cache-Control:
              description: The answer may be kept, but must be checked again with If-None-Match.
              x-description-fr: La réponse peut être gardée, mais doit être revérifiée avec If-None-Match.
              schema:
                type: string
                enum:
                  - private, no-cache
          content:
