          x-description-fr: L'id du téléphone.
        user_id:
          type: string
          description: Its user's id.
          x-description-fr: L'id de son utilisateur.
    RecordingChannel:
      type: object
      additionalProperties: false
      required: [channel_id, file_id, type, side, via, resource, caller_id, phone, user, extension]
