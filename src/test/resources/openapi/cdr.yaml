        - mixdown_duration_milli
        - mixdown_file_id
        - channel_list
      properties:
        recording_session_id:
          type: string
          description: The recording's id.
          x-description-fr: L'id de l'enregistrement.
        start_timestamp_milli:
          type: integer
          format: int64
          description: When the recording started, in Unix milliseconds.
          x-description-fr: Le début de l'enregistrement, en millisecondes Unix.
        stop_timestamp_milli:
          type: integer
          format: int64
          description: When the recording stopped, in Unix milliseconds.
          x-description-fr: La fin de l'enregistrement, en millisecondes Unix.
        start_reason:
          type: string
          description: |
            Why it started. Other values can appear.
            - AUTOMATIC: the phone records its calls automatically.
            - ON_DEMAND: someone pressed *70.
          x-description-fr: |
            Pourquoi il a commencé. D'autres valeurs peuvent apparaître.
            - AUTOMATIC : le téléphone enregistre ses appels automatiquement.
            - ON_DEMAND : quelqu'un a composé *70.
        stop_reason:
          type: string
          description: |
            Why it stopped. Other values can appear.
            - ON_DEMAND: someone pressed *71.
            - CALL_END: the call ended.
          x-description-fr: |
            Pourquoi il s'est arrêté. D'autres valeurs peuvent apparaître.
            - ON_DEMAND : quelqu'un a composé *71.
            - CALL_END : l'appel s'est terminé.
        phone_list:
          type: array
          description: The recorded phones and their users.
          x-description-fr: Les téléphones enregistrés et leurs utilisateurs.
          items:
            $ref: "#/components/schemas/RecordingPhone"
        state:
          type: string
          enum: [IN_PROGRESS, RECORDING_COMPLETE, PROCESSED, FAILED_TOO_MANY_RETRIES, EXPIRED]
          description: |
            - PROCESSED: the files are ready to download.
            - IN_PROGRESS: still recording; read the CDR again later.
            - RECORDING_COMPLETE: the files are being prepared; read the CDR again in a few minutes.
            - FAILED_TOO_MANY_RETRIES: no file will be made.
            - EXPIRED: the files were deleted.
          x-description-fr: |
            - PROCESSED : les fichiers sont prêts à télécharger.
            - IN_PROGRESS : l'enregistrement est en cours ; relisez le CDR plus tard.
            - RECORDING_COMPLETE : les fichiers sont en préparation ; relisez le CDR dans quelques minutes.
            - FAILED_TOO_MANY_RETRIES : aucun fichier ne sera produit.
            - EXPIRED : les fichiers ont été supprimés.
        mixdown_duration_milli:
          type: integer
          format: int64
          description: The mixdown's duration, in milliseconds.
          x-description-fr: La durée du fichier mixé, en millisecondes.
        mixdown_file_id:
          type: string
          description: The mixdown's file id when PROCESSED; empty before.
          x-description-fr: L'id du fichier mixé quand PROCESSED ; vide avant.
        channel_list:
          type: array
          description: One channel file per party, then the music on hold; empty until PROCESSED.
          x-description-fr: Un fichier de canal par personne, puis la musique d'attente ; vide jusqu'à PROCESSED.
          items:
            $ref: "#/components/schemas/RecordingChannel"
    RecordingPhone:
