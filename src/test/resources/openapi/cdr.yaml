  /api/v1/cdr/{id}/recording/dl/mixdown/{file_id}:
    get:
      operationId: GetRecordingMixdownDownload
      security:
        - ubikToken: ["login:{org_id}:rw", "cdr:{org_id}:r"]
        - ubikToken: ["login:{org_id}:rw", "cdr:{org_id}:rw"]
        - ubikToken: ["login:{org_id}:rw", "admin:{org_id}:r"]
        - ubikToken: ["login:{org_id}:rw", "admin:{org_id}:rw"]
      x-api-key-scopes: ["login:{org_id}:rw", "cdr:{org_id}:r"]
      x-api-key-rights:
        - en: "Call history: Read"
          fr: "Historique d'appel : Lecture"
      summary: Mixdown file link
      x-summary-fr: Lien du fichier mixé
      description: |
        Get a link to download a recording's mixdown: every party of the call
        in one MP3 file. The link is short-lived: ask for a new one each time.
      x-description-fr: |
        Obtenez un lien pour télécharger le fichier mixé d'un enregistrement :
        toutes les personnes de l'appel dans un seul fichier MP3. Le lien est
        de courte durée : demandez-en un nouveau chaque fois.
      parameters:
        - $ref: "#/components/parameters/CDRID"
        - name: file_id
          in: path
          required: true
          description: The recording's mixdown_file_id, from Get a CDR.
          x-description-fr: Le mixdown_file_id de l'enregistrement, tiré de Lire un CDR.
          schema:
            type: string
        - $ref: "#/components/parameters/OrgID"
      responses:
        "200":
          description: The link.
          x-description-fr: Le lien.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingDownload"
              example:
                {
                  "download_url": "https://storage.googleapis.com/example-bucket/9b4e7c2a-1f6d-4a8b-b3e5-7c9d2f1a6e84?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Expires=300&X-Goog-Signature=example"
                }
        "400":
          $ref: "#/components/responses/BadRequestOrgID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/FileNotFound"
        "409":
          $ref: "#/components/responses/NotProcessed"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/v1/cdr/{id}/recording/dl/channel/{file_id}:
    get:
      operationId: GetRecordingChannelDownload
      security:
        - ubikToken: ["login:{org_id}:rw", "cdr:{org_id}:r"]
        - ubikToken: ["login:{org_id}:rw", "cdr:{org_id}:rw"]
        - ubikToken: ["login:{org_id}:rw", "admin:{org_id}:r"]
        - ubikToken: ["login:{org_id}:rw", "admin:{org_id}:rw"]
      x-api-key-scopes: ["login:{org_id}:rw", "cdr:{org_id}:r"]
      x-api-key-rights:
        - en: "Call history: Read"
          fr: "Historique d'appel : Lecture"
      summary: Channel file link
      x-summary-fr: Lien d'un fichier de canal
      description: |
        Get a link to download one channel file of a recording: one party's
        side of the call, or the music on hold. The link is short-lived: ask
        for a new one each time.
      x-description-fr: |
        Obtenez un lien pour télécharger un fichier de canal d'un
        enregistrement : le côté d'une personne dans l'appel, ou la musique
        d'attente. Le lien est de courte durée : demandez-en un nouveau chaque
        fois.
      parameters:
        - $ref: "#/components/parameters/CDRID"
        - name: file_id
          in: path
          required: true
          description: A file_id from the recording's channel_list, from Get a CDR.
          x-description-fr: Un file_id de la channel_list de l'enregistrement, tiré de Lire un CDR.
          schema:
            type: string
        - $ref: "#/components/parameters/OrgID"
      responses:
        "200":
          description: The link.
          x-description-fr: Le lien.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingDownload"
              example:
                {
                  "download_url": "https://storage.googleapis.com/example-bucket/4c8a2e6f-3d1b-4f9a-a7c5-2e8d6b4f1a93?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Expires=300&X-Goog-Signature=example"
                }
        "400":
          $ref: "#/components/responses/BadRequestOrgID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/FileNotFound"
        "409":
          $ref: "#/components/responses/NotProcessed"
        "500":
          $ref: "#/components/responses/ServerError"
components:
  securitySchemes:
    ubikToken:
      type: oauth2
      description: |
        An access token, sent in the header Authorization: Bearer <token>.
        Get it from Get a token with your API key, asking in scope for every
        scope the request needs: the token holds only the scopes you ask for.
        The flow type below is a placeholder: OpenAPI 3.0 has no jwt-bearer
        flow. Request the token with
        grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer, your signed
        assertion in assertion, and the scopes in scope.
      x-description-fr: |
        Un jeton d'accès, envoyé dans l'en-tête Authorization: Bearer <jeton>.
        Obtenez-le avec Obtenir un jeton et votre clé d'API, en demandant dans
        scope chaque portée dont la requête a besoin : le jeton n'a que les
        portées demandées.
        Le type de flux ci-dessous est un substitut : OpenAPI 3.0 n'a pas de
        flux jwt-bearer. Demandez le jeton avec
        grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer, votre assertion
        signée dans assertion, et les portées dans scope.
      flows:
        clientCredentials:
          tokenUrl: /api/v1/auth/oauth/token
          scopes:
            "login:{org_id}:rw": Member of the organization. Every API key has it.
            "cdr:{org_id}:r": Read the organization's CDRs.
            "cdr:{org_id}:rw": Same as cdr:{org_id}:r here.
            "admin:{org_id}:r": The organization's administrator. Never an API key.
            "admin:{org_id}:rw": The organization's administrator. Never an API key.
          x-scopes-fr:
            "login:{org_id}:rw": Membre de l'organisation. Toute clé d'API l'a.
            "cdr:{org_id}:r": Lire les CDR de l'organisation.
            "cdr:{org_id}:rw": Comme cdr:{org_id}:r ici.
            "admin:{org_id}:r": L'administrateur de l'organisation. Jamais une clé d'API.
            "admin:{org_id}:rw": L'administrateur de l'organisation. Jamais une clé d'API.
  parameters:
    CDRID:
      name: id
      in: path
      required: true
      description: The CDR's id.
      x-description-fr: L'id du CDR.
      schema:
        type: string
    OrgID:
      name: org_id
      in: query
      required: true
      description: Your organization's id.
      x-description-fr: L'id de votre organisation.
      schema:
        type: string
  responses:
    BadRequestOrgID:
      description: |
        Request refused:
        - org_id is empty.
        Body: plain text.
      x-description-fr: |
        Requête refusée :
        - org_id est vide.
        Corps : texte brut.
      content:
        text/plain:
          schema:
            type: string
    Unauthorized:
      description: |
        Access token refused:
        - The access token is missing.
        - The access token has expired.
        - The access token is invalid.
        Body: plain text.
      x-description-fr: |
        Jeton d'accès refusé :
        - Le jeton d'accès est absent.
        - Le jeton d'accès a expiré.
        - Le jeton d'accès est invalide.
        Corps : texte brut.
      content:
        text/plain:
          schema:
            type: string
    Forbidden:
      description: |
        Refused:
        - The token lacks a scope this request needs.
        Body: plain text, naming the missing scope.
      x-description-fr: |
        Refusé :
        - Il manque au jeton une portée dont cette requête a besoin.
        Corps : texte brut, qui nomme la portée manquante.
      content:
        text/plain:
          schema:
            type: string
    FileNotFound:
      description: |
        Not found:
        - The CDR doesn't exist in this organization.
        - file_id isn't a file of this kind for this CDR.
        Body: plain text.
      x-description-fr: |
        Introuvable :
        - Le CDR n'existe pas dans cette organisation.
        - file_id n'est pas un fichier de ce type pour ce CDR.
        Corps : texte brut.
      content:
        text/plain:
          schema:
            type: string
          examples:
            cdr_not_found:
              value: cdr not found
            file_not_found:
              value: file not found
    NotProcessed:
      description: |
        The recording has no file to give. What to do, by state:
        - RECORDING_COMPLETE: try again later.
        - IN_PROGRESS: try again later.
        - FAILED_TOO_MANY_RETRIES: don't retry.
        - EXPIRED: don't retry.
        Body: plain text, "recording is" then the state.
      x-description-fr: |
        L'enregistrement n'a pas de fichier à donner. Que faire, selon l'état :
        - RECORDING_COMPLETE : réessayez plus tard.
        - IN_PROGRESS : réessayez plus tard.
        - FAILED_TOO_MANY_RETRIES : ne réessayez pas.
        - EXPIRED : ne réessayez pas.
        Corps : texte brut, « recording is » suivi de l'état.
      content:
        text/plain:
          schema:
            type: string
          examples:
            recording_complete:
              value: recording is RECORDING_COMPLETE
            in_progress:
              value: recording is IN_PROGRESS
            failed_too_many_retries:
              value: recording is FAILED_TOO_MANY_RETRIES
            expired:
              value: recording is EXPIRED
    ServerError:
      description: |
        Server error.
        - Try again later.
        Body: empty.
      x-description-fr: |
        Erreur du serveur.
        - Réessayez plus tard.
        Corps : vide.
  schemas:
    ListCDRRequest:
      type: object
      additionalProperties: false
      required: [org_id, list_query]
      properties:
        org_id:
          type: string
          minLength: 1
          description: Your organization's id.
          x-description-fr: L'id de votre organisation.
        resource_type:
          type: string
          description: |
            Which CDRs.
            - Absent: every CDR of the organization in the time window.
            - Present: only the CDRs that touched a resource of this type.
            - EXTENSION: an extension.
            - PHONE: a phone.
            - USER: a user.
            - IVR: an automated attendant.
            - PHONE_NUMBER: one of your organization's phone numbers.
            - NUMBER: an outside number.
          x-description-fr: |
