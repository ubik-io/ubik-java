      x-description-fr: Le poste, quand resource_type vaut EXTENSION.
      properties:
        id:
          type: string
          description: The extension's id.
          x-description-fr: L'id du poste.
        number:
          type: integer
          description: The extension number.
          x-description-fr: Le numéro de poste.
        description:
          type: string
          description: Its name.
          x-description-fr: Son nom.
    PhoneView:
      type: object
