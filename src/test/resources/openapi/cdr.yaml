      properties:
        channel_id:
          type: string
          description: The channel's id.
          x-description-fr: L'id du canal.
        file_id:
          type: string
          description: The file's id, for Channel file link.
          x-description-fr: L'id du fichier, pour Lien d'un fichier de canal.
        type:
          type: string
          description: |
            What the file holds. Other values can appear.
            - voice: one party.
            - moh: the music on hold.
          x-description-fr: |
            Ce que contient le fichier. D'autres valeurs peuvent apparaître.
            - voice : une personne.
            - moh : la musique d'attente.
        side:
          type: string
          enum: [CALLER, CALLEE, ""]
          description: |
            For a channel of type voice:
            - CALLER: the caller's side.
            - CALLEE: the called side.
            "" for any other channel.
          x-description-fr: |
            Pour un canal de type voice :
            - CALLER : le côté de l'appelant.
            - CALLEE : le côté de l'appelé.
            "" pour tout autre canal.
        via:
          type: string
          description: For a channel of type voice, the step type the party came through (see timeline); "" for any other channel.
          x-description-fr: Pour un canal de type voice, le type d'étape par lequel la personne est passée (voir timeline) ; "" pour tout autre canal.
        resource:
          allOf:
            - $ref: "#/components/schemas/TimelineResource"
          nullable: true
          description: |
            What the channel's step acted on, as in the timeline:
            - FROM_SIP_PHONE: the phone that called, type PHONE.
            - RING_PHONE: the phone that rang, type PHONE.
            - FROM_SIP_PSTN: your phone number that was called, type PHONE_NUMBER.
            - Any other channel: null.
          x-description-fr: |
            Ce sur quoi l'étape du canal a agi, comme dans la timeline :
            - FROM_SIP_PHONE : le téléphone qui a appelé, de type PHONE.
            - RING_PHONE : le téléphone qui a sonné, de type PHONE.
            - FROM_SIP_PSTN : votre numéro de téléphone qui a été appelé, de type PHONE_NUMBER.
            - Tout autre canal : null.
        caller_id:
          allOf:
            - $ref: "#/components/schemas/SessionCallerID"
          description: The caller ID of the party on this channel.
          x-description-fr: L'identité de l'appelant de la personne sur ce canal.
        phone:
          allOf:
            - $ref: "#/components/schemas/RecordingChannelPhone"
          nullable: true
          description: The org's phone on this channel; null for an outside party or a channel without a party.
          x-description-fr: Le téléphone de l'organisation sur ce canal ; null pour une personne de l'extérieur ou un canal sans personne.
        user:
          allOf:
            - $ref: "#/components/schemas/RecordingChannelUser"
          nullable: true
          description: The user that phone had during the call; null when it had none, or when there is no phone.
          x-description-fr: L'utilisateur qu'avait ce téléphone pendant l'appel ; null s'il n'en avait pas, ou s'il n'y a pas de téléphone.
        extension:
          allOf:
            - $ref: "#/components/schemas/ExtensionView"
          nullable: true
          description: |
            The extension the call reached that phone through: the closest one above its step in the timeline.
            - FROM_SIP_PHONE: always null; a calling phone reaches no extension.
            - No extension above the step: null.
            - No phone on the channel: null.
          x-description-fr: |
            Le poste par lequel l'appel a joint ce téléphone : le plus proche au-dessus de son étape dans la timeline.
            - FROM_SIP_PHONE : toujours null ; un téléphone qui appelle ne joint aucun poste.
            - Aucun poste au-dessus de l'étape : null.
            - Aucun téléphone sur le canal : null.
    SessionCallerID:
      type: object
      additionalProperties: false
      required: [internal, external]
      description: |
        The caller ID of the party on a channel, as presented on the call:
        - FROM_SIP_PHONE or RING_PHONE: the phone's own caller ID, internal and external.
        - FROM_SIP_PSTN: what the outside caller presented, external only.
        - TO_SIP_PSTN: the number dialed and the name the other end gave, external only.
