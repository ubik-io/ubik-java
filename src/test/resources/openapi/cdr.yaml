          description: |
            - ATTENDED_TRANSFER: an attended transfer joined the two calls.
          x-description-fr: |
            - ATTENDED_TRANSFER : un transfert supervisé a réuni les deux appels.
        relation:
          type: string
          enum: [CONSULT, MERGED]
          description: |
            - CONSULT: the linked CDR is the consultation call's, which was joined to this call.
            - MERGED: this CDR is the consultation call's; the linked CDR is the call it joined.
          x-description-fr: |
            - CONSULT : le CDR lié est celui de l'appel de consultation réuni à cet appel.
            - MERGED : ce CDR est celui de l'appel de consultation ; le CDR lié est celui de l'appel qu'il a rejoint.
    ResourceRef:
      type: object
      additionalProperties: false
      required: [resource_type, resource_id, label_snapshot, deleted]
      description: A resource the call involved, as it is now.
      x-description-fr: Une ressource touchée par l'appel, telle qu'elle est maintenant.
      properties:
        resource_type:
          type: string
          enum: [EXTENSION, PHONE, USER, IVR, PHONE_NUMBER, NUMBER]
          description: |
            - EXTENSION: an extension.
            - PHONE: a phone.
            - USER: a user.
            - IVR: an automated attendant.
            - PHONE_NUMBER: one of your organization's phone numbers.
            - NUMBER: an outside number.
          x-description-fr: |
            - EXTENSION : un numéro de poste.
            - PHONE : un téléphone.
            - USER : un utilisateur.
            - IVR : un standard automatique.
            - PHONE_NUMBER : un des numéros de téléphone de votre organisation.
            - NUMBER : un numéro externe.
        resource_id:
          type: string
          description: The resource's id; for a NUMBER, the number itself.
          x-description-fr: L'id de la ressource ; pour un NUMBER, le numéro lui-même.
        label_snapshot:
          type: string
          description: Its name during the call.
          x-description-fr: Son nom pendant l'appel.
        deleted:
          type: boolean
          description: True when the resource no longer exists.
          x-description-fr: Vrai si la ressource n'existe plus.
        roles:
          type: array
          description: |
            What it was in the call. Other values can appear.
            - CALLER: it placed the call.
            - CALLED: it was called.
            - CALLER_ID: the number shown to the person called.
            - A step type (see timeline): it took part in that step.
          x-description-fr: |
            Son rôle dans l'appel. D'autres valeurs peuvent apparaître.
            - CALLER : elle a fait l'appel.
            - CALLED : elle a été appelée.
            - CALLER_ID : le numéro affiché à la personne appelée.
            - Un type d'étape (voir timeline) : elle a pris part à cette étape.
          items:
            type: string
        extension:
          $ref: "#/components/schemas/ExtensionView"
        phone:
          $ref: "#/components/schemas/PhoneView"
        user:
          $ref: "#/components/schemas/UserView"
        ivr:
          $ref: "#/components/schemas/IVRView"
        phone_number:
          $ref: "#/components/schemas/PhoneNumberView"
    ExtensionView:
      type: object
