          x-description-fr: L'id de la ressource.
        label:
          type: string
          description: Its name during the call.
          x-description-fr: Son nom pendant l'appel.
        snapshot:
          description: |
            The resource as it was during the call, kept even after the resource is deleted or changed. Its fields depend on type; new fields can appear.
