        - FROM_SIP_PHONE ou RING_PHONE : la propre identité du téléphone, interne et externe.
        - FROM_SIP_PSTN : ce que l'appelant de l'extérieur a présenté, externe seulement.
        - TO_SIP_PSTN : le numéro composé et le nom donné par l'autre bout, externe seulement.
        - Un canal sans personne : les deux à null.
