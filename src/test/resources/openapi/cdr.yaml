    RecordingItem:
      type: object
      additionalProperties: false
      description: One recording of the call.
      x-description-fr: Un enregistrement de l'appel.
      required:
        - recording_session_id
        - start_timestamp_milli
        - stop_timestamp_milli
        - start_reason
        - stop_reason
