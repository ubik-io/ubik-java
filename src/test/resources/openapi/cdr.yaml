    TimelineResource:
      type: object
      additionalProperties: false
      required: [type, id]
      description: The resource a step acted on, as it was during the call.
      x-description-fr: La ressource sur laquelle une étape a agi, telle qu'elle était pendant l'appel.
      properties:
        type:
          type: string
