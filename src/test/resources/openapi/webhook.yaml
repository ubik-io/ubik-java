openapi: 3.0.3
info:
  title: UBIK webhooks
  x-title-fr: Webhooks UBIK
  version: "1"
  description: |
    What UBIK sends to your webhook. OpenAPI 3.0 has no section for requests
    sent to you, so they are under x-webhooks, shaped like OpenAPI 3.1's
    webhooks section.
  x-description-fr: |
    Ce qu'UBIK envoie à votre webhook. OpenAPI 3.0 n'a pas de section pour
    les requêtes qui vous sont envoyées : elles sont sous x-webhooks, dans la
    forme de la section webhooks d'OpenAPI 3.1.
paths: {}
x-webhooks:
  cdr-add:
    post:
      operationId: CDRAdd
      summary: Call completed (cdr-add)
      x-summary-fr: Appel terminé (cdr-add)
      description: |
        Sent once per call. The body only names the CDR: read it with Get a CDR.
        When it is sent:
        - A call without recordings: when its CDR is created.
        - A call with recordings: when they are all final, processed or failed.
        - Recordings not final 10 minutes after the CDR is created: at that time.
      x-description-fr: |
        Envoyé une fois par appel. Le corps nomme seulement le CDR : lisez-le avec Lire un CDR.
        Quand il est envoyé :
        - Un appel sans enregistrement : à la création de son CDR.
        - Un appel avec enregistrements : quand ils sont tous finaux, traités ou échoués.
        - Enregistrements pas finaux 10 minutes après la création du CDR : à ce moment.
      parameters:
        - $ref: "#/components/parameters/WebhookID"
        - $ref: "#/components/parameters/WebhookTimestamp"
        - $ref: "#/components/parameters/WebhookSignature"
        - $ref: "#/components/parameters/UserAgent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CDRAddEvent"
            example:
              {
                "id": "8f1c2d3e-4a5b-4c6d-9e7f-0a1b2c3d4e5f",
                "type": "cdr-add",
                "org_id": "7d1f3a5c-2b4e-4f6a-8c9d-0e1f2a3b4c5d",
                "api_version": "1.0",
                "creation_timestamp_milli": 1794268800000,
                "data": {
                  "id": "8f1c2d3e-4a5b-4c6d-9e7f-0a1b2c3d4e5f"
                }
              }
      responses:
        "2XX":
          description: |
            Any 2xx response within 10 seconds: the delivery succeeded.
            - The body you send back isn't read.
          x-description-fr: |
            Toute réponse 2xx en moins de 10 secondes : l'envoi a réussi.
            - Le corps que vous renvoyez n'est pas lu.
        default:
          description: |
            Any other response, or none within 10 seconds: the delivery failed and is attempted again.
            - Each attempt: the same body and the same webhook-id.
            - Attempts: 9.
            - Last attempt after the first: 65 h 36 min.
            - Retry rules: see Receive webhooks.
            - After the 9th failed attempt, with no successful delivery to this webhook since this event's first attempt: the webhook becomes Inactive.
            - Then: your organization's administrators get an email.
          x-description-fr: |
            Toute autre réponse, ou aucune en moins de 10 secondes : l'envoi a échoué et est réessayé.
            - Chaque essai : le même corps et le même webhook-id.
            - Essais : 9.
            - Dernier essai après le premier : 65 h 36 min.
            - Règles d'essai : voir Recevoir les webhooks.
            - Après le 9e essai échoué, sans aucun envoi réussi vers ce webhook depuis le premier essai de cet événement : le webhook passe à Désactivé.
            - Ensuite : les administrateurs de votre organisation reçoivent un courriel.
      x-signature-test-vector:
        secret: "whsec_ZXhhbXBsZS1zaWduaW5nLXNlY3JldC0zMi1ieXRlcyE="
        webhook-id: "8f1c2d3e-4a5b-4c6d-9e7f-0a1b2c3d4e5f"
        webhook-timestamp: "1794268805"
        body: '{"id":"8f1c2d3e-4a5b-4c6d-9e7f-0a1b2c3d4e5f","type":"cdr-add","org_id":"7d1f3a5c-2b4e-4f6a-8c9d-0e1f2a3b4c5d","api_version":"1.0","creation_timestamp_milli":1794268800000,"data":{"id":"8f1c2d3e-4a5b-4c6d-9e7f-0a1b2c3d4e5f"}}'
        webhook-signature: "v1,v+UygUl6v0tkIuuFYm0PnfNOnaDEzYzD7+9Nle1SdkQ="
components:
  parameters:
    WebhookID:
      name: webhook-id
      in: header
      required: true
      description: The event's id, the same on every attempt; use it to ignore a repeat. For cdr-add, the CDR's id.
      x-description-fr: L'id de l'événement, le même à chaque essai ; servez-vous-en pour ignorer un doublon. Pour cdr-add, l'id du CDR.
      schema:
        type: string
        minLength: 1
      example: "8f1c2d3e-4a5b-4c6d-9e7f-0a1b2c3d4e5f"
    WebhookTimestamp:
      name: webhook-timestamp
      in: header
      required: true
      description: When this attempt was sent, in Unix seconds. Refuse a time too far from your clock.
      x-description-fr: Le moment de l'envoi de cet essai, en secondes Unix. Refusez un moment trop loin de votre horloge.
      schema:
        type: string
        pattern: "^[0-9]+$"
      example: "1794268805"
    WebhookSignature:
      name: webhook-signature
      in: header
      required: true
      description: |
        The signature, as Standard Webhooks defines it:
        - Format: v1, then the base64 of the HMAC-SHA256 of webhook-id.webhook-timestamp.body.
        - Key: the bytes of your signing secret, the base64 after whsec_.
        - After you change the secret and keep the old one: two signatures, separated by a space, for 24 hours.
        - Accept the request if one signature matches.
      x-description-fr: |
        La signature, telle que Standard Webhooks la définit :
        - Format : v1, puis le base64 du HMAC-SHA256 de webhook-id.webhook-timestamp.corps.
        - Clé : les octets de votre secret de signature, le base64 après whsec_.
        - Après un changement de secret où vous gardez l'ancien : deux signatures, séparées par une espace, pendant 24 heures.
        - Acceptez la requête si une signature correspond.
      schema:
        type: string
        pattern: "^v1,[A-Za-z0-9+/]+={0,2}( v1,[A-Za-z0-9+/]+={0,2})*$"
      example: "v1,v+UygUl6v0tkIuuFYm0PnfNOnaDEzYzD7+9Nle1SdkQ="
    UserAgent:
      name: User-Agent
      in: header
      required: true
      description: The sender, UBIK Webhooks, with its version and a link to the Receive webhooks guide.
      x-description-fr: L'expéditeur, UBIK Webhooks, avec sa version et un lien vers le guide Recevoir les webhooks.
      schema:
        type: string
        enum: ["UBIK-Webhooks/1.0 (+https://ubik.io/en/developers/receive-webhooks/)"]
  schemas:
    CDRAddEvent:
      type: object
      additionalProperties: false
      required: [id, type, org_id, api_version, creation_timestamp_milli, data]
      description: The event.
      x-description-fr: L'événement.
      properties:
        id:
          type: string
          minLength: 1
          description: The event's id, as in webhook-id.
          x-description-fr: L'id de l'événement, comme dans webhook-id.
        type:
          type: string
          enum: [cdr-add]
          description: The event type.
          x-description-fr: Le type d'événement.
        org_id:
          type: string
          minLength: 1
          description: Your organization's id.
          x-description-fr: L'id de votre organisation.
        api_version:
          type: string
          enum: ["1.0"]
          description: The body's version. New fields may be added to data; none is removed.
          x-description-fr: La version du corps. Des champs peuvent s'ajouter à data ; aucun n'est retiré.
        creation_timestamp_milli:
          type: integer
          format: int64
          description: When the event was made, in Unix milliseconds; the same on every attempt.
          x-description-fr: Le moment de la création de l'événement, en millisecondes Unix ; le même à chaque essai.
        data:
          allOf:
            - $ref: "#/components/schemas/CDRAddData"
          description: What the event is about.
          x-description-fr: Ce dont parle l'événement.
    CDRAddData:
      type: object
      additionalProperties: false
      required: [id]
      description: What the event is about.
      x-description-fr: Ce dont parle l'événement.
      properties:
        id:
          type: string
          minLength: 1
          description: The CDR to read with GET /api/v1/cdr/{id} (Get a CDR). A test event has 00000000-0000-0000-0000-000000000000 (no CDR).
          x-description-fr: Le CDR à lire avec GET /api/v1/cdr/{id} (Lire un CDR). Un événement test a 00000000-0000-0000-0000-000000000000 (aucun CDR).
