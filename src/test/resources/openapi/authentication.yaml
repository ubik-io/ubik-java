openapi: 3.0.3
info:
  title: UBIK API authentication
  x-title-fr: Authentification de l'API UBIK
  version: '1'
paths:
  /api/v1/auth/oauth/token:
    post:
      operationId: GetToken
      security: []
      x-api-key-scopes: []
      x-api-key-rights: []
      summary: Get a token
      x-summary-fr: Obtenir un jeton
      description: |
        Exchange an assertion signed with your API key file for an access
        token. No access token needed: this request gives you one.
      x-description-fr: "Échangez une assertion signée avec le fichier de votre clé d'API\ncontre un jeton d'accès. Aucun jeton d'accès requis\_: cette requête\nvous en donne un.\n"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GetTokenRequest'
            example:
              grant_type: urn:ietf:params:oauth:grant-type:jwt-bearer
              assertion: >-
                eyJhbGciOiJSUzI1NiIsImtpZCI6ImtleS0yIiwidHlwIjoiSldUIn0.eyJpc3MiOiI3YzlkMGUxZi0zYTRiLTRjNWQtOGU2Zi0wYTFiMmMzZDRlNWYiLCJzdWIiOiI3YzlkMGUxZi0zYTRiLTRjNWQtOGU2Zi0wYTFiMmMzZDRlNWYiLCJhdWQiOiJodHRwczovL3ViaWsuaW8vYXBpL3YxL2F1dGgvb2F1dGgvdG9rZW4iLCJpYXQiOjE3OTQyNjg4MDAsImV4cCI6MTc5NDI2ODg2MCwianRpIjoiNWUxYjdkM2EtOWM0Zi00YTJlLThiNmQtMWYzYzVhN2U5ZDIwIn0.ZXhhbXBsZS1hc3NlcnRpb24tc2lnbmF0dXJl
              scope: >-
                login:7d1f3a5c-2b4e-4f6a-8c9d-0e1f2a3b4c5d:rw
                cdr:7d1f3a5c-2b4e-4f6a-8c9d-0e1f2a3b4c5d:r
      responses:
        '200':
          description: |
            The access token. The body is JSON, sent with the header
            Content-Type: text/plain; read it as JSON.
          x-description-fr: |
            Le jeton d'accès. Le corps est du JSON, envoyé avec l'en-tête
            Content-Type: text/plain ; lisez-le comme du JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTokenSuccessResponse'
              example:
                access_token: >-
                  eyJhbGciOiJSUzI1NiIsImtpZCI6ImtpZC0xIiwidHlwIjoiSldUIn0..ZXhhbXBsZS1hY2Nlc3MtdG9rZW4tc2lnbmF0dXJl
                id_token: ''
                token_type: Bearer
                expires_in: 900
        '400':
          description: |
            Request refused. Each line is the error code, then the cause:
            - Plain-text body: the form can't be read.
            - Plain-text body: grant_type is unknown.
            - invalid_request: assertion is empty.
            - invalid_grant: the assertion isn't a JWT.
            - invalid_grant: iat is missing.
            - invalid_grant: exp is more than 5 minutes after iat.
            - invalid_grant: this jti was already used.
            - invalid_scope: scope asks for a scope the API key doesn't hold.
          x-description-fr: "Requête refusée. Chaque ligne donne le code d'erreur, puis la cause\_:\n- Corps en texte brut\_: le formulaire est illisible.\n- Corps en texte brut\_: grant_type est inconnu.\n- invalid_request\_: assertion est vide.\n- invalid_grant\_: l'assertion n'est pas un JWT.\n- invalid_grant\_: iat est absent.\n- invalid_grant\_: exp est plus de 5 minutes après iat.\n- invalid_grant\_: ce jti a déjà été utilisé.\n- invalid_scope\_: scope demande une portée que la clé d'API n'a pas.\n"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTokenErrorResponsePayload'
              examples:
                assertion_empty:
                  value:
                    error: invalid_request
                    error_description: field assertion cannot be empty
                assertion_not_a_jwt:
                  value:
                    error: invalid_grant
                    error_description: assertion is malformed
                lifetime_too_long:
                  value:
                    error: invalid_grant
                    error_description: assertion lifetime exceeds the allowed maximum
                jti_reused:
                  value:
                    error: invalid_grant
                    error_description: The provided authorization grant has already been used.
                scope_not_held:
                  value:
                    error: invalid_scope
                    error_description: Scope phone:7d1f3a5c-2b4e-4f6a-8c9d-0e1f2a3b4c5d:rw is forbidden for client
            text/plain:
              schema:
                type: string
              examples:
                unknown_grant_type:
                  value: 'invalid grant_type: password'
        '401':
          description: |
            Assertion refused. Each line is the error code, then the cause:
            - invalid_grant: the API key doesn't exist.
            - invalid_grant: the API key was deleted.
            - invalid_grant: kid isn't one of the API key's files.
            - invalid_grant: the signature doesn't match the key file.
            - invalid_grant: aud is wrong.
            - invalid_grant: exp is missing.
            - invalid_grant: exp is past.
            - invalid_grant: sub differs from iss.
            - invalid_request: scope can't be read.
          x-description-fr: "Assertion refusée. Chaque ligne donne le code d'erreur, puis la cause\_:\n- invalid_grant\_: la clé d'API n'existe pas.\n- invalid_grant\_: la clé d'API a été supprimée.\n- invalid_grant\_: kid n'est pas un des fichiers de la clé d'API.\n- invalid_grant\_: la signature ne correspond pas au fichier de clé.\n- invalid_grant\_: aud est faux.\n- invalid_grant\_: exp est absent.\n- invalid_grant\_: exp est passé.\n- invalid_grant\_: sub est différent de iss.\n- invalid_request\_: scope est illisible.\n"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTokenErrorResponsePayload'
              examples:
                assertion_refused:
                  value:
                    error: invalid_grant
                    error_description: The provided authorization grant is invalid, expired, or revoked.
                scope_unreadable:
                  value:
                    error: invalid_request
                    error_description: invalid scope found
        '500':
          description: |
            Server error.
            - server_error: an error at UBIK; try again later.
            Body: JSON error and error_description.
          x-description-fr: "Erreur du serveur.\n- server_error\_: une erreur chez UBIK ; réessayez plus tard.\nCorps\_: JSON error et error_description.\n"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTokenErrorResponsePayload'
              example:
                error: server_error
                error_description: ''
components:
  schemas:
    GetTokenRequest:
      type: object
      additionalProperties: false
      required:
        - grant_type
        - assertion
      properties:
        grant_type:
          type: string
          enum:
            - urn:ietf:params:oauth:grant-type:jwt-bearer
          description: '- urn:ietf:params:oauth:grant-type:jwt-bearer: with an API key.'
          x-description-fr: "- urn:ietf:params:oauth:grant-type:jwt-bearer\_: avec une clé d'API."
        assertion:
          type: string
          description: >
            Required. A JWT signed with the private_key of your API key file.

            - Header alg: RS256.

            - Header kid: the key file's key_id.

            - Without kid: the API key's first file is used.

            - iss: the key file's id.

            - sub: the key file's id.

            - aud: https://ubik.io/api/v1/auth/oauth/token.

            - iat: now, in Unix seconds.

            - exp: at most 5 minutes after iat.

            - Clock tolerance on exp: 30 seconds.

            - jti: required in practice; send a new unique id in each assertion.

            - Without jti: every API key shares one empty id, so after one assertion without jti,
            every other one is refused at least until that one expires, plus 30 seconds.
          x-description-fr: "Obligatoire. Un JWT signé avec la private_key du fichier de votre clé d'API.\n- En-tête alg\_: RS256.\n- En-tête kid\_: le key_id du fichier de clé.\n- Sans kid\_: le premier fichier de la clé d'API est utilisé.\n- iss\_: l'id du fichier de clé.\n- sub\_: l'id du fichier de clé.\n- aud\_: https://ubik.io/api/v1/auth/oauth/token.\n- iat\_: maintenant, en secondes Unix.\n- exp\_: au plus 5 minutes après iat.\n- Tolérance d'horloge sur exp\_: 30 secondes.\n- jti\_: obligatoire en pratique ; envoyez un nouvel id unique dans chaque assertion.\n- Sans jti\_: toutes les clés d'API partagent un même id vide ; après une assertion sans jti, toute autre est refusée au moins jusqu'à l'expiration de la première, plus 30 secondes.\n"
        scope:
          type: string
          description: >
            The scopes you need, separated by spaces. Each one is resource:organization:action, for
            example login:7d1f3a5c-2b4e-4f6a-8c9d-0e1f2a3b4c5d:rw
            cdr:7d1f3a5c-2b4e-4f6a-8c9d-0e1f2a3b4c5d:r.

            The token holds only the scopes you ask for, and only ones the API key holds.
          x-description-fr: >
            Les portées dont vous avez besoin, séparées par des espaces. Chacune est
            ressource:organisation:action, par exemple login:7d1f3a5c-2b4e-4f6a-8c9d-0e1f2a3b4c5d:rw
            cdr:7d1f3a5c-2b4e-4f6a-8c9d-0e1f2a3b4c5d:r.

            Le jeton n'a que les portées demandées, et seulement celles que la clé d'API a.
    GetTokenSuccessResponse:
      type: object
      additionalProperties: false
      required:
        - access_token
        - id_token
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
          minLength: 1
          description: The access token. Send it in the header Authorization, after Bearer and a space.
          x-description-fr: Le jeton d'accès. Envoyez-le dans l'en-tête Authorization, après Bearer et une espace.
        id_token:
          type: string
          description: Empty for an API key.
          x-description-fr: Vide pour une clé d'API.
        token_type:
          type: string
          enum:
            - Bearer
          description: The token type.
          x-description-fr: Le type de jeton.
        expires_in:
          type: integer
          minimum: 1
          description: Seconds until the token expires. Ask for a new one then.
          x-description-fr: Secondes avant l'expiration du jeton. Demandez-en un nouveau ensuite.
    GetTokenErrorResponsePayload:
      type: object
      additionalProperties: false
      required:
        - error
        - error_description
      properties:
        error:
          type: string
          enum:
            - invalid_request
            - invalid_grant
            - invalid_scope
            - server_error
          description: |-
            - invalid_request: a field is missing or can't be read.
            - invalid_grant: the assertion is refused.
            - invalid_scope: a scope the API key doesn't hold.
            - server_error: an error on UBIK's side.
          x-description-fr: "- invalid_request\_: un champ est absent ou illisible.\n- invalid_grant\_: l'assertion est refusée.\n- invalid_scope\_: une portée que la clé d'API n'a pas.\n- server_error\_: une erreur du côté d'UBIK."
        error_description:
          type: string
          description: A sentence that explains the error, in English. May be empty.
          x-description-fr: Une phrase qui explique l'erreur, en anglais. Peut être vide.
